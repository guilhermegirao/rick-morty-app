  redis:
    image: redis:8.6.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  redis_data:
